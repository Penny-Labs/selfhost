{{- if include "pennyos.generatedSecrets.needsJob" . }}
{{- $hookAnnotations := dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-delete-policy" "before-hook-creation" "helm.sh/hook-weight" "-30" -}}
{{- if .Values.generatedSecrets.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pennyos.generatedSecretsServiceAccountName" . }}
  labels:
    {{- include "pennyos.labels" . | nindent 4 }}
    app.kubernetes.io/component: generated-secrets
  annotations:
    {{- toYaml $hookAnnotations | nindent 4 }}
    {{- with .Values.generatedSecrets.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.generatedSecrets.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- if .Values.generatedSecrets.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pennyos.generatedSecretsRoleName" . }}
  labels:
    {{- include "pennyos.labels" . | nindent 4 }}
    app.kubernetes.io/component: generated-secrets
  annotations:
    {{- toYaml $hookAnnotations | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pennyos.generatedSecretsRoleName" . }}
  labels:
    {{- include "pennyos.labels" . | nindent 4 }}
    app.kubernetes.io/component: generated-secrets
  annotations:
    {{- toYaml $hookAnnotations | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "pennyos.generatedSecretsRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pennyos.generatedSecretsServiceAccountName" . }}
    namespace: {{ .Release.Namespace | quote }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pennyos.generatedSecretsJobName" . }}
  labels:
    {{- include "pennyos.labels" . | nindent 4 }}
    app.kubernetes.io/component: generated-secrets
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-20"
    {{- with .Values.generatedSecrets.job.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ .Values.generatedSecrets.job.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.generatedSecrets.job.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.generatedSecrets.job.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "pennyos.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: generated-secrets
      {{- with .Values.generatedSecrets.job.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "pennyos.generatedSecretsServiceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bootstrap
          image: "{{ required "generatedSecrets.job.image.repository is required" .Values.generatedSecrets.job.image.repository }}:{{ required "generatedSecrets.job.image.tag is required" .Values.generatedSecrets.job.image.tag }}"
          imagePullPolicy: {{ .Values.generatedSecrets.job.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              set -eu

              SECRET_NAME={{ include "pennyos.generatedSecretsName" . | quote }}
              NAMESPACE={{ .Release.Namespace | quote }}

              kubectl get secret "$SECRET_NAME" -n "$NAMESPACE" >/dev/null 2>&1 || \
                kubectl create secret generic "$SECRET_NAME" -n "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

              kubectl label secret "$SECRET_NAME" -n "$NAMESPACE" \
                {{ printf "app.kubernetes.io/name=%s" (include "pennyos.name" .) | quote }} \
                {{ printf "app.kubernetes.io/instance=%s" .Release.Name | quote }} \
                "app.kubernetes.io/managed-by={{ .Release.Service }}" \
                "app.kubernetes.io/component=generated-secrets" \
                --overwrite

              {{- range $key, $value := .Values.generatedSecrets.annotations }}
              kubectl annotate secret "$SECRET_NAME" -n "$NAMESPACE" {{ printf "%s=%s" $key (toString $value) | quote }} --overwrite
              {{- end }}

              ensure_random_key() {
                key="$1"
                bytes="$2"
                if kubectl get secret "$SECRET_NAME" -n "$NAMESPACE" -o "jsonpath={.data.${key}}" | grep -q .; then
                  echo "preserving existing ${key}"
                  return
                fi

                value="$(head -c "$bytes" /dev/urandom | base64 | tr -d '\n')"
                encoded="$(printf '%s' "$value" | base64 | tr -d '\n')"
                kubectl patch secret "$SECRET_NAME" -n "$NAMESPACE" --type merge -p "{\"data\":{\"${key}\":\"${encoded}\"}}"
                echo "generated ${key}"
              }

              {{- if include "pennyos.generatedSecrets.sessionSigningKeyEnabled" . }}
              ensure_random_key {{ .Values.auth.sessionSigningKeyKey | quote }} 64
              {{- end }}
              {{- if include "pennyos.generatedSecrets.runtimeLeaseEncryptionKeyEnabled" . }}
              ensure_random_key {{ include "pennyos.management.runtimeLeaseEncryptionKeySecretKey" . | quote }} 32
              {{- end }}
              {{- if include "pennyos.generatedSecrets.postgresqlPasswordEnabled" . }}
              ensure_random_key {{ include "pennyos.postgresql.adminPasswordSecretKey" . | quote }} 24
              ensure_random_key {{ include "pennyos.db.passwordSecretKey" . | quote }} 24
              {{- end }}
          {{- with .Values.generatedSecrets.job.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
